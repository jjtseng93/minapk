<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>minapk fullscreen test</title>
<style>
  body { font: 16px sans-serif; background: #202124; color: white; margin: 16px; }
  button, input { margin: 8px 0; padding: 10px; }
  #panel { background: #164451; padding: 16px; box-sizing: border-box; }
  #panel:fullscreen { width: 100%; height: 100%; overflow: auto; }
  video { display: block; width: 100%; max-height: 50vh; background: black; }
  pre { white-space: pre-wrap; }
</style>
<h1>WebView fullscreen</h1>
<p>Test with the extra-keys bar both visible and hidden. Back should exit fullscreen
without navigating away. Also try switching WebViews from the volume-up menu.</p>
<input placeholder="Focus here to open the keyboard first">
<section id="panel">
  <button id="enter">Enter element fullscreen</button>
  <button id="exit">Exit fullscreen</button>
  <p>For video fullscreen, select a local video and use its native fullscreen control.</p>
  <input id="file" type="file" accept="video/*">
  <video id="video" controls playsinline></video>
  <pre id="status"></pre>
</section>
<script>
  const status = document.getElementById('status');
  const video = document.getElementById('video');
  const panel = document.getElementById('panel');
  const log = text => { status.textContent = text + '\n' + status.textContent.slice(0, 3000); };
  log(navigator.userAgent + '\nfullscreenEnabled=' + document.fullscreenEnabled);
  document.getElementById('enter').onclick = async () => {
    try { await panel.requestFullscreen(); }
    catch (error) { log('requestFullscreen: ' + error); }
  };
  document.getElementById('exit').onclick = async () => {
    try { if (document.fullscreenElement) await document.exitFullscreen(); }
    catch (error) { log('exitFullscreen: ' + error); }
  };
  document.addEventListener('fullscreenchange', () => log('fullscreenElement=' +
    (document.fullscreenElement?.id || 'none')));
  document.addEventListener('fullscreenerror', () => log('fullscreenerror'));
  let url;
  document.getElementById('file').onchange = event => {
    const file = event.target.files[0];
    if (!file) return;
    if (url) URL.revokeObjectURL(url);
    video.src = url = URL.createObjectURL(file);
  };
</script>
</html>
